# Memory for the Gradle daemon. The first build decompiles Minecraft and needs this much.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.2
# clientSideOnly in mods.toml needs Forge 47.3.25 or newer.
forge_version_range=[47.3.25,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties

mod_id=dataexport
mod_name=Data Export
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.mojolowjo.dataexport
mod_authors=mojolowjo
mod_description=Client-side: /dataexport writes the pack's recipes, tags, items, loot tables, ore world-gen and KubeJS scripts to a folder an AI can read.
