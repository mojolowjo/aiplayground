// Copied into server\aitest\cfg on every start. Names checked against Rust 2636.290.1.
server.description "Private test server for player-like AI."
fps.limit 30

// Human NPCs. ai.think and ai.npc_enable stay on so they can't interfere with our own bots.
ai.scientist_spawners_enabled false
ai.npc_spawn_on_junkpile false
ai.npc_spawn_on_cargo_ship false
ai.npc_spawn_on_deep_sea_islands false
ai.npc_max_population_military_tunnels 0
bradley.enabled false
server.events false

// Building: players in creative mode can place anything anywhere (monuments, rocks, no
// socket rules). Only players given the flag get it: creative.togglecreativemodeuser <name> true
creative.freeplacement true

