# Memory for the Gradle daemon. The first build decompiles Minecraft and needs this much.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.2
# clientSideOnly in mods.toml and ResourceLocation.fromNamespaceAndPath both need Forge 47.3.25 or newer.
forge_version_range=[47.3.25,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependency versions (see docs/RESEARCH.md for where these came from)

# JEI for 1.20.1 Forge, from https://maven.blamejared.com
jei_version=15.20.0.106
# EMI for 1.20.1 Forge, from https://maven.terraformersmc.com/releases
emi_version=1.1.24+1.20.1
# Curios API for 1.20.1 Forge, from https://maven.theillusivec4.top
curios_version=5.14.1+1.20.1

## Mod Properties

mod_id=craftchain
mod_name=CraftChain
mod_license=MIT
mod_version=0.2.0
mod_group_id=com.mojolowjo.craftchain
mod_authors=mojolowjo
mod_description=Client-side auto-crafter: pick an item in JEI or EMI and CraftChain crafts it, intermediates included, from what you carry.
