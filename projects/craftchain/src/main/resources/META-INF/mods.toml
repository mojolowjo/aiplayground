modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/mojolowjo/aiplayground/issues"

# Purely client-side. Forge 47.4 understands this flag: it sets the display test to
# IGNORE_ALL_VERSION (so servers without the mod show no red X) and skips loading the
# mod on dedicated servers.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=true
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5,)"
    ordering="AFTER"
    side="CLIENT"
