# Builds and tests the Cloudly mod, then runs a short benchmark to check the harness still
# works. Only runs when files in projects/minecraft-optimization change.
name: minecraft-optimization

on:
  push:
    paths:
      - 'projects/minecraft-optimization/**'
      - '.github/workflows/minecraft-optimization.yml'
  pull_request:
    paths:
      - 'projects/minecraft-optimization/**'
      - '.github/workflows/minecraft-optimization.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/minecraft-optimization

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Benchmark smoke test
        run: >
          python3 benchmarks/bench.py run --stacks baseline,cloudly --scenarios idle,hoppers
          --repeats 1 --warmup 100 --measure 200 --no-jfr --label ci-smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloudly-build
          path: |
            projects/minecraft-optimization/mod/build/libs/
            projects/minecraft-optimization/benchmarks/results/ci-smoke/
            projects/minecraft-optimization/benchmarks/work/logs/
          if-no-files-found: ignore
